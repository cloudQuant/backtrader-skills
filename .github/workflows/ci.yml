name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install distribution with dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Docs build gate
        run: mkdocs build --strict
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: python -m mypy src/backtrader_skills
      - name: Catalog snapshot check
        run: python scripts/build_catalog.py --check
      - name: Distribution manifest check
        run: python scripts/build_manifest.py --check

  test-supported-python:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install distribution with test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: pytest
        run: python -m pytest tests -q
        # Tests that need the backtrader source package (execution, doctor,
        # acceptance) auto-skip when it is absent. Run the full suite locally
        # with the backtrader fork checked out as a sibling, or with
        # BT_BACKTRADER_DIR pointing at the backtrader package directory.
