name: docs

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install distribution with docs extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build the docs site
        env:
          DOCS_SITE_URL: https://cloudquant.github.io/backtrader-skills/
        run: python scripts/build_docs.py --strict
      - name: Publish the site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
