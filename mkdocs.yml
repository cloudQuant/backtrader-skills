site_name: backtrader-skills
strict: true

# Developer plan and acceptance artifacts must not be published on the public site.
exclude_docs: |
  superpowers/
  iterations/

theme:
  name: material

nav:
  - Home: index.md
  - Skills: skills.md
  - Evaluations: evals.md
  - Changelog: changelog.md
  - Roadmap: roadmap.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 中文
